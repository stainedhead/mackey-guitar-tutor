[package]
name = "mackey-app"
version = "0.0.0"
description = "Mackey Guitar Tutor: the Tauri shell (commands, events, windows)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"

[lib]
# staticlib and cdylib are what `tauri ios build` and Android link; rlib is for tests.
name = "mackey_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mackey-app"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
mackey-theory = { path = "../crates/mackey-theory", features = ["ts"] }
mackey-voicing = { path = "../crates/mackey-voicing", features = ["ts"] }
mackey-audio = { path = "../crates/mackey-audio", features = ["ts"] }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
