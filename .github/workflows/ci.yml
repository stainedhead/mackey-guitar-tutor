name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # System packages the Tauri crates (WebKitGTK, GTK, libsoup) and cpal (ALSA) link on Linux.
  LINUX_PACKAGES: >-
    libwebkit2gtk-4.1-dev libasound2-dev libgtk-3-dev libsoup-3.0-dev
    librsvg2-dev libayatana-appindicator3-dev

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the real target; Linux is a cheap, fast check of the portable core.
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny
      # The Makefile writes a stub ui/dist/index.html so these steps do not need Node.
      - name: Format
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Architecture rules
        run: make archcheck
      - name: Docs checks
        run: make doccheck
      - name: Test
        run: make test
      - name: Coverage
        run: make cover
      - name: Licences and advisories
        if: runner.os == 'Linux'
        run: make deny
      - name: Property tests (many cases)
        if: runner.os == 'Linux'
        run: make props

  ui:
    name: ui (lint, types, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Lint, format check and type check
        run: make ui-lint
      - name: Unit tests
        run: make ui-test

  e2e:
    name: e2e (Playwright WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      # The browser build is tied to the pinned Playwright version in ui/package-lock.json.
      - name: Install WebKit and its system libraries
        run: npx --prefix ui playwright install --with-deps webkit
      - name: Playwright (desktop and iPad projects)
        run: make e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results

  bindings:
    name: bindings (stale check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate the TypeScript bindings and fail on any difference
        run: make bindings-check

  mac-app:
    name: mac-app (universal build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml lists both Apple macOS triples, so this installs them.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Unsigned apart from the ad-hoc signature (signingIdentity "-"); no Apple secrets.
      - name: Build the universal app
        run: make app
      - name: Check that both architectures are in the binary
        run: |
          set -euo pipefail
          bin=$(find target/universal-apple-darwin/release/bundle/macos -path '*.app/Contents/MacOS/*' -type f | head -n 1)
          test -n "$bin"
          archs=$(lipo -archs "$bin")
          echo "$bin: $archs"
          case "$archs" in *arm64*) ;; *) echo "arm64 missing"; exit 1 ;; esac
          case "$archs" in *x86_64*) ;; *) echo "x86_64 missing"; exit 1 ;; esac
      - name: Upload the unsigned app
        uses: actions/upload-artifact@v5
        with:
          name: mackey-macos-universal
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  ios-sim:
    name: ios-sim (iOS Simulator build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml lists aarch64-apple-ios and aarch64-apple-ios-sim.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Show the Xcode and simulator runtimes on this image
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      # `tauri ios init` needs XcodeGen to write the Xcode project.
      - name: Install XcodeGen
        run: brew install xcodegen
      # Unsigned debug build for the Simulator: tauri ios init --ci, then tauri ios build
      # --debug --target aarch64-sim (no Apple account; the simulator needs no signing).
      - name: Simulator build with the Tauri CLI
        run: make ios-sim
