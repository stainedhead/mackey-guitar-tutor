[workspace]
resolver = "3"
# Domain crates live in crates/<name>/ (mackey-theory, mackey-voicing, ...) and the Tauri
# shell in src-tauri/ (crate mackey-app). Add each one here when you create it, and to the
# layer table in xtask/src/archcheck.rs and AGENTS.md.
members = ["crates/mackey-audio", "crates/mackey-theory", "crates/mackey-voicing", "src-tauri", "xtask"]

[workspace.package]
edition = "2024"
# Keep in step with rust-toolchain.toml (the single source for the toolchain).
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/stainedhead/mackey-guitar-tutor"
publish = false

[workspace.dependencies]
# Every third-party version is declared once here; crates use `dep = { workspace = true }`.
# Add an entry when the first crate needs it (cargo warns about unused ones). Standard
# picks (AGENTS.md): thiserror 2, serde 1 (derive), proptest 1, insta 1 (yaml), criterion.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
proptest = "1"
insta = { version = "1", features = ["yaml"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
cpal = "0.18"
rtrb = "0.4"
assert_no_alloc = "1"
# Tauri 2 stable line (3.x is alpha); tauri-build must match tauri's major.
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# CI runs clippy with -D warnings, so every "warn" here fails the build.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# No panics in library code; clippy.toml allows these in tests.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Property tests and snapshot diffs run much faster with optimised dependencies.
# The pitch detector and synth are number crunching; unoptimised they make the audio tests slow.
[profile.dev.package.mackey-audio]
opt-level = 3

[profile.dev.package.proptest]
opt-level = 3

[profile.dev.package.insta]
opt-level = 3

[profile.dev.package.similar]
opt-level = 3
