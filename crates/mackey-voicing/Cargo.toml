[package]
name = "mackey-voicing"
version = "0.1.0"
description = "Pure fretboard engine for Mackey Guitar Tutor: tunings, voicing search, triads, arpeggios, scale patterns, selection and the FretboardView"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Generate TypeScript bindings for the boundary types (`cargo test -p mackey-voicing --features ts`).
ts = ["dep:ts-rs", "mackey-theory/ts"]

[dependencies]
mackey-theory = { path = "../mackey-theory" }
serde = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "view"
harness = false

[lints]
workspace = true
